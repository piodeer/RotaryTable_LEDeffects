<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbio - the rotating table - Assembly Guide</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        /* --- BASE STYLES --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root{
            --vh: 1vh;
            --header-h: 60px;
            --cta-h: 56px;
            --footer-h: 64px;
            --extra-bottom: -32px; /* fine‑tuning: reduces bottom spacer a bit */
        }
        html, body {
            height: 100%;
        }
        body { 
            margin: 0; 
            background: #EFE4D6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden;
            color: #6B4F3A; 
        }
        
        /* --- HEADER --- */
        .header { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            padding: 12px 18px; 
            font-weight: 600; 
            background: rgba(239, 228, 214, 0.9); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            z-index: 10; 
            border-bottom: 0.5px solid rgba(107, 79, 58, 0.15); 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo-wrap{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-wrap img{
            height: 28px;
            width: 28px;
            border-radius: 8px;
            filter: none;
        }
        .header-title{
            font-size: 15px;
            letter-spacing: 0.2px;
        }

        /* --- HORIZONTAL SCROLLING --- */
        .steps { 
            display: flex; 
            height: calc(var(--vh) * 100);
            overflow-x: auto; 
            overflow-y: hidden;
            scroll-snap-type: x mandatory; 
            scroll-behavior: smooth; 
            scrollbar-width: none; 
            align-items: stretch;
        }
        @supports (height: 100dvh) {
            .steps { height: 100dvh; }
        }
        .steps::-webkit-scrollbar { display: none; }

        /* --- INDIVIDUAL STEP --- */
        .step { 
            flex: 0 0 100%; 
            scroll-snap-align: start; 
            height: 100%;
            min-height: 0;
            padding: 0;
            overflow: hidden;
            display: block;
        }
        @supports (height: 100dvh) {
            .step { height: 100dvh; }
        }
        .step-scroll{
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y pinch-zoom;
            padding: calc(var(--header-h) + 14px) 18px 16px 18px;
            display: flex;
            justify-content: center;
        }
        .bottom-spacer{
            height: calc(var(--cta-h) + var(--footer-h) + var(--extra-bottom) + 18px + env(safe-area-inset-bottom, 0px));
        }
        .step-content { max-width: 500px; width: 100%; }

        /* --- BLOCKS --- */
        .block { background: rgba(255, 255, 255, 0.7); border-radius: 24px; padding: 22px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(107, 79, 58, 0.08); }
        .title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
        .hero-img img, .video video { width: 100%; border-radius: 20px; display: block; }
        .qr-print-only{
            display: none;
        }
        .text { font-size: 16px; line-height: 1.5; color: rgba(107, 79, 58, 0.8); }
        .text a{
            color: #8B6130;
            font-weight: 700;
            text-decoration: underline;
        }
        
        /* --- UI ELEMENTS --- */
        .nav-guide { display: flex; justify-content: space-around; margin-top: 20px; padding: 15px; background: rgba(107, 79, 58, 0.08); border-radius: 18px; font-size: 13px; font-weight: 500; border: 1px solid rgba(107, 79, 58, 0.12); }
        .print-btn {
            position: fixed; top: 15px; right: 15px; z-index: 20;
            background: #8B6130; color: white; border: none;
            padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600;
            cursor: pointer; box-shadow: 0 4px 10px rgba(139, 97, 46, 0.3);
        }

        .icons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .icon { background: rgba(107, 79, 58, 0.08); border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 500; text-align: center; }
        .list a{
            color: #8B6130;
            text-decoration: underline;
            font-weight: 500;
        }

        /* Inventory Bilder */
        .list ul{
            list-style: none;
            padding: 0;
        }

        .list li{
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }

        .list ul.with-price li{
            display: grid;
            grid-template-columns: 60px 1fr 120px;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        .list ul.with-price li.no-img{
            grid-template-columns: 1fr 120px;
        }

        .list-text{
            min-width: 0;
            font-size: 14px;
        }
        .price-pill{
            justify-self: end;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.2px;
            color: #6B4F3A;
            background: rgba(139, 97, 46, 0.14);
            border: 1px solid rgba(139, 97, 46, 0.28);
            white-space: nowrap;
        }
        .price-pill.muted{
            color: rgba(107, 79, 58, 0.6);
            background: rgba(107, 79, 58, 0.12);
            border: 1px solid rgba(107, 79, 58, 0.22);
        }
        .cost-summary{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .cost-summary .total{
            font-weight: 900;
            font-size: 18px;
            letter-spacing: -0.2px;
        }
        .cost-summary .meta{
            color: rgba(107, 79, 58, 0.7);
            font-size: 13px;
            font-weight: 600;
        }

        .list img{
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            background: #DCCCC0;
            cursor: zoom-in;
        }   

        /* --- SUB-STEPS / TILES --- */
        .substep{
            position: relative;
            padding-top: 56px; /* reserve space so badge never overlaps content */
        }
        .substep-badge{
            position: absolute;
            top: 14px;
            left: 14px;
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: rgba(139, 97, 46, 0.95);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.2px;
            box-shadow: 0 10px 26px rgba(139,97,46,0.22);
            border: 1px solid rgba(255,255,255,0.22);
            z-index: 2;
        }

        .tile{
            display: block; /* always stack: media then text */
        }
        .tile-media{
            margin-bottom: 10px;
        }
        .tile-text{
            min-width: 0;
            padding-top: 0;
        }
        .tile .tile-text .text{
            color: rgba(107, 79, 58, 0.8);
        }
        @media (max-width: 520px){
            .tile-media{
                margin-bottom: 12px;
            }
        }

        /* --- LIGHTBOX --- */
        .lightbox{
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.82);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 9999;
        }
        .lightbox.open{ display: flex; }
        .lightbox-inner{
            max-width: min(1100px, 96vw);
            max-height: 92vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox img{
            max-width: 100%;
            max-height: 92vh;
            width: auto;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 18px 60px rgba(0,0,0,0.45);
            background: #111;
        }
        .hero-img img{
            cursor: zoom-in;
        }
        @media print{
            .lightbox{ display: none !important; }
        }

        /* --- FOOTER UI --- */
        .footer-ui { position: fixed; bottom: 0; width: 100%; padding-bottom: 52px; background: linear-gradient(to top, #EFE4D6 80%, transparent); pointer-events: none; z-index: 10; }
        .progress { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(107, 79, 58, 0.3); transition: all 0.4s ease; }
        .dot.active { background: #8B6130; width: 18px; border-radius: 4px; }
        .swipe-hint { text-align: center; font-size: 11px; font-weight: 600; color: rgba(107, 79, 58, 0.6); text-transform: uppercase; letter-spacing: 1px; }

        .cta-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)) 12px;
            z-index: 20;
            pointer-events: auto;
            touch-action: manipulation;
        }
        .nav-btn{
            border: none;
            background: rgba(139, 97, 46, 0.95);
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.1px;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 26px rgba(139,97,46,0.25);
            border: 1px solid rgba(255,255,255,0.18);
        }
        .nav-btn.secondary{
            background: rgba(107, 79, 58, 0.86);
            box-shadow: 0 10px 26px rgba(107, 79, 58, 0.22);
        }
        .nav-btn:active { transform: translateY(1px); }
        .nav-btn[disabled]{
            opacity: 0.45;
            cursor: default;
            transform: none;
        }
        .cta-inner{
            max-width: 540px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* --- PRINT / PDF STYLES --- */
        @media print {
            @page { margin: 1cm; }
            body { overflow: visible; background: white !important; }
            .steps { display: block; height: auto; overflow: visible; }
            .step { 
                display: flex !important; 
                flex-direction: column;
                align-items: center; /* Centering content for PDF */
                text-align: left;
                break-after: page;
                page-break-after: always;
                padding: 24px 0 !important; 
                height: auto; 
            }
            .step:last-child{
                break-after: auto;
                page-break-after: auto;
            }
            .step-scroll{ height: auto !important; overflow: visible !important; padding: 0 !important; display: block !important; }
            .bottom-spacer{ display: none !important; }

            .step-content { max-width: 520px; margin: 0 auto; }
            .header, .footer-ui, .cta-bar, .print-btn, .swipe-hint, .nav-guide { display: none !important; }

            .block {
                box-shadow: none;
                border: 1px solid #DCCCC0;
                break-inside: avoid;
                border-radius: 16px;
                padding: 14px;
                margin-bottom: 10px;
            }
            .title { font-size: 20px; margin-bottom: 6px; }
            .text { font-size: 13px; line-height: 1.45; }
            .hero-img img, .video video { border-radius: 14px; }
            .video video{ display: none !important; }
            .qr-print-only{
                display: block;
                text-align: center;
            }
            .qr-print-only img{
                width: 120px;
                height: 120px;
                margin: 8px auto 0;
                display: block;
            }
            .list ul { width: 100%; margin: 0; padding: 0; }
            /* two-column compact "table" nur für Preis-Tabelle */
            .list ul.with-price{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px 12px;
            }
            .list ul.with-price li{
                display: grid;
                grid-template-columns: 48px 1fr 90px;
                gap: 6px;
                align-items: center;
                padding: 4px 8px;
                border: 1px solid #DCCCC0;
                border-radius: 10px;
            }
            .list ul.with-price li.no-img{
                grid-template-columns: 1fr 90px;
            }
            .list ul.with-price img{
                width: 48px;
                height: 48px;
                border-radius: 8px;
                background: #DCCCC0;
            }
            .list ul.with-price .list-text{
                font-size: 11px;
            }
            .list ul.with-price .price-pill{
                padding: 4px 8px;
                border-radius: 999px;
                font-size: 10px;
                border: 1px solid rgba(139, 97, 46, 0.28);
                background: rgba(139, 97, 46, 0.14);
            }
            .icons { display: flex; justify-content: center; gap: 12px; }
            .icon { padding: 10px; font-size: 12px; border-radius: 10px; }

            .substep-badge{
                box-shadow: none;
                border: 1px solid #8B6130;
                width: 34px;
                height: 34px;
                font-size: 12px;
                top: 10px;
                left: 10px;
            }
            .substep{
                padding-top: 44px; /* tighter for PDF */
            }
            .tile{
                display: block;
            }
            .tile-media{
                margin-bottom: 10px;
            }
        }

        /* FLOATING SIDE PANEL - Desktop Only */
        .side-panel {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 24px 18px;
            box-shadow: 0 10px 40px rgba(107, 79, 58, 0.12);
            border: 1px solid rgba(107, 79, 58, 0.1);
            z-index: 5;
            display: none;
            flex-direction: column;
            gap: 16px;
            max-height: 80vh;
            overflow-y: auto;
            scrollbar-width: none;
            opacity: 0.15;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .side-panel::-webkit-scrollbar {
            display: none;
        }
        @media (min-width: 1200px) {
            .side-panel { display: flex; }
        }
        .side-panel:hover {
            opacity: 1;
        }
        .side-panel-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(107, 79, 58, 0.6);
            margin-bottom: 8px;
        }
        .side-panel-list {
            font-size: 13px;
            color: rgba(107, 79, 58, 0.7);
            line-height: 1.6;
        }
        .side-panel-item {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.7;
        }
        .side-panel-item:hover {
            background: rgba(139, 97, 46, 0.1);
            opacity: 1;
            transform: translateX(4px);
        }
        .side-panel-item.active {
            background: rgba(139, 97, 46, 0.15);
            color: #8B6130;
            font-weight: 600;
            opacity: 1;
            border-left: 2px solid #8B6130;
            padding-left: 10px;
        }

        /* HELP / FEEDBACK BUTTON */
        .help-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(139, 97, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(139, 97, 46, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            pointer-events: auto;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .help-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(139, 97, 46, 0.4);
        }
        .help-button:active {
            transform: scale(0.95);
        }

        /* HELP MODAL */
        .help-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }
        .help-modal.active {
            display: flex;
        }
        .help-modal-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        .help-modal-content h2 {
            font-size: 24px;
            font-weight: 800;
            color: #6B4F3A;
            margin-bottom: 24px;
            margin-top: 0;
        }
        .help-modal-description {
            font-size: 14px;
            color: rgba(107, 79, 58, 0.7);
            line-height: 1.6;
            margin-bottom: 24px;
            margin-top: 0;
        }
        .help-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .help-option-btn {
            padding: 16px 20px;
            border: 2px solid rgba(139, 97, 46, 0.2);
            background: rgba(139, 97, 46, 0.05);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            font-weight: 600;
            color: #6B4F3A;
            text-align: left;
        }
        .help-option-btn:hover {
            border-color: rgba(139, 97, 46, 0.4);
            background: rgba(139, 97, 46, 0.12);
            transform: translateX(4px);
        }
        .help-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6B4F3A;
            transition: transform 0.2s ease;
        }
        .help-modal-close:hover {
            transform: rotate(90deg);
        }
        .help-modal-content {
            position: relative;
        }

        /* DARK MODE */
        @media (prefers-color-scheme: dark) {
            body { background: #2a1f15; color: #f5f0e8; }
            .header { background: rgba(42, 31, 21, 0.9); border-bottom: 0.5px solid rgba(139, 97, 46, 0.3); }
            .block { background: #3d2e21; }
            .nav-guide, .icon { background: rgba(139, 97, 46, 0.15); }
            .footer-ui { background: linear-gradient(to top, #2a1f15 80%, transparent); }
            .nav-btn { box-shadow: 0 10px 26px rgba(139,97,46,0.18); border: 1px solid rgba(255,255,255,0.12); }
            .nav-btn.secondary{ background: rgba(58,58,60,0.76); box-shadow: 0 10px 26px rgba(0,0,0,0.30); }
            .side-panel {
                background: rgba(61, 46, 33, 0.85);
                border-color: rgba(139, 97, 46, 0.2);
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
                opacity: 0.08;
            }
            .side-panel:hover {
                opacity: 1;
            }
            .side-panel-title {
                color: rgba(245, 240, 232, 0.7);
            }
            .side-panel-list {
                color: rgba(245, 240, 232, 0.8);
            }
            .side-panel-item:hover {
                background: rgba(139, 97, 46, 0.15);
            }
            .side-panel-item.active {
                background: rgba(139, 97, 46, 0.25);
                color: #d4a574;
            }
            .help-button {
                background: rgba(139, 97, 46, 0.8);
                box-shadow: 0 8px 32px rgba(139, 97, 46, 0.25);
            }
            .help-button:hover {
                box-shadow: 0 12px 40px rgba(139, 97, 46, 0.35);
            }
            .help-modal-content {
                background: rgba(61, 46, 33, 0.95);
                color: #f5f0e8;
            }
            .help-modal-content h2 {
                color: #f5f0e8;
            }
            .help-modal-description {
                color: rgba(245, 240, 232, 0.7);
            }
            .help-option-btn {
                border-color: rgba(139, 97, 46, 0.3);
                background: rgba(139, 97, 46, 0.1);
                color: #f5f0e8;
            }
            .help-option-btn:hover {
                border-color: rgba(139, 97, 46, 0.5);
                background: rgba(139, 97, 46, 0.2);
            }
            .help-modal-close {
                color: #f5f0e8;
            }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Save as PDF</button>
    <div class="header">
        <div class="logo-wrap" aria-hidden="true">
            <img src="https://raw.githubusercontent.com/piodeer/LinkTree/123f2c662ee69c1d3352d1f69be6b601eb3a88ca/media/logo.png" alt="Orbio Logo">
        </div>
        <div class="header-title" id="main-title">Loading Guide...</div>
    </div>

    <!-- Floating Side Panel - Desktop Only -->
    <div class="side-panel" id="sidePanel">
        <div class="side-panel-title">📑 All Chapters</div>
        <div class="side-panel-list" id="chapterList"></div>
    </div>

    <!-- Help Button -->
    <button class="help-button" id="helpButton" title="Ask a question or report a bug">?</button>

    <!-- Help Modal -->
    <div class="help-modal" id="helpModal">
        <div class="help-modal-content">
            <button class="help-modal-close" id="helpModalClose">&times;</button>
            <h2>How can we help?</h2>
            <p class="help-modal-description">A mail window will open where you can describe your question or report a bug. Your message will be sent to sales.piodeer@gmail.com</p>
            <div class="help-options">
                <button class="help-option-btn" id="questionBtn">❓ Ask a Question</button>
                <button class="help-option-btn" id="bugBtn">🐛 Report a Bug</button>
            </div>
        </div>
    </div>

    <div class="steps" id="steps-container">
        </div>

    <div class="footer-ui">
        <div class="progress" id="progress-dots"></div>
    </div>

    <div class="cta-bar" aria-label="Next step">
        <div class="cta-inner">
            <button class="nav-btn secondary" id="prev-btn" type="button">
                <span aria-hidden="true">←</span>
                <span>Previous</span>
            </button>
            <button class="nav-btn" id="next-btn" type="button">
                <span id="next-btn-label">Next step</span>
                <span aria-hidden="true">→</span>
            </button>
        </div>        
    </div>

        const container = document.getElementById('steps-container');

        function getStepNumber(step, fallbackNumber){
            const title = step?.title || '';
            const titleSection = Array.isArray(step?.sections) ? (step.sections.find(s => s?.type === 'title')?.text || '') : '';
            const m = (title || titleSection).match(/Step\s+(\d+)/i);
            if (m) return Number(m[1]);
            return fallbackNumber;
        }

        function renderBadge(stepNo, subNo){
            return `<span class="substep-badge">${stepNo}.${subNo}</span>`;
        }

        function formatCurrency(value){
            const v = Number(value) || 0;
            return v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function renderPricePill(price){
            if (price === undefined || price === null || price === '') {
                return `<span class="price-pill muted">—</span>`;
            }
            const n = Number(price);
            if (!Number.isFinite(n)) return `<span class="price-pill muted">—</span>`;
            return `<span class="price-pill">$${formatCurrency(n)}</span>`;
        }
        function computeTotalFromConfig(){
            let total = 0;
            (config?.steps || []).forEach((step) => {
                const sections = Array.isArray(step?.sections) ? step.sections : [];
                sections.forEach((section) => {
                    if (section?.type !== 'list' || !Array.isArray(section?.items)) return;
                    section.items.forEach((it) => {
                        if (typeof it === 'string') return;
                        const p = Number(it?.price);
                        if (Number.isFinite(p)) total += p;
                    });
                });
            });
            return total;
        }
        function updateTotals(){
            const totalEls = document.querySelectorAll('[data-cost-total]');
            const total = computeTotalFromConfig();
            totalEls.forEach(el => {
                el.textContent = `$${formatCurrency(total)}`;
            });
        }
        function renderCostSummary(stepNo, subNo){
            const badge = renderBadge(stepNo, subNo);
            return `
                <div class="block substep">
                    ${badge}
                    <div class="cost-summary">
                        <div>
                            <div class="meta">Total cost (guide price for purchased parts – actual cost can vary by supplier)</div>
                            <div class="total" data-cost-total>$0.00</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderList(list, badgeHtml = '', titleText = '') {
            if (!list) return '';
            const isTools = titleText && titleText.trim().toLowerCase() === 'tools';
            const hasPrice = list.some(it => typeof it !== 'string' && it && it.price !== undefined && it.price !== null && it.price !== '');

            const items = list.map(item => {
                if (typeof item === 'string') {
                    const label = item;
                    // Tools are simple strings without price slot
                    if (isTools) {
                        return `<li class="no-img"><span class="list-text">${label}</span></li>`;
                    }
                    if (!hasPrice) {
                        return `<li class="no-img"><span class="list-text">${label}</span></li>`;
                    }
                    return `<li class="no-img"><span class="list-text">${label}</span>${renderPricePill(undefined)}</li>`;
                }

                const label = item.text || item.label || '';
                const hasImg = Boolean(item.img);
                const liClass = hasImg ? 'has-img' : 'no-img';
                const img = hasImg ? `<img class="list-img" src="${item.img}" alt="">` : '';

                if (item.url) {
                    if (!hasPrice) {
                        return `<li class="${liClass}">${img}<a class="list-text" href="${item.url}" target="_blank" rel="noopener noreferrer">${label}</a></li>`;
                    }
                    return `<li class="${liClass}">${img}<a class="list-text" href="${item.url}" target="_blank" rel="noopener noreferrer">${label}</a>${renderPricePill(item.price)}</li>`;
                }

                if (!hasPrice) {
                    return `<li class="${liClass}">${img}<span class="list-text">${label}</span></li>`;
                }
                return `<li class="${liClass}">${img}<span class="list-text">${label}</span>${renderPricePill(item.price)}</li>`;
            }).join('');

            const title = titleText ? `<div class="title" style="font-size:18px; margin-bottom:10px;">${titleText}</div>` : '';
            const ulClass = isTools || !hasPrice ? 'no-price' : 'with-price';
            return `<div class="block list substep">${badgeHtml}${title}<ul class="${ulClass}">${items}</ul></div>`;
        }

        function getInventoryComponents(){
            // Source-of-truth: Step 1 inventory list (first component list with images/prices)
            const steps = Array.isArray(config?.steps) ? config.steps : [];
            for (const step of steps) {
                const sections = Array.isArray(step?.sections) ? step.sections : [];
                for (const section of sections) {
                    if (section?.type !== 'list' || !Array.isArray(section?.items)) continue;
                    const objs = section.items.filter(it => typeof it === 'object' && it && (it.img || it.url || it.price !== undefined));
                    const hasAnyImg = objs.some(it => Boolean(it?.img));
                    const hasAnyPrice = objs.some(it => it?.price !== undefined && it?.price !== null && it?.price !== '');
                    if (objs.length && hasAnyImg && hasAnyPrice) return objs;
                }
            }
            return [];
        }

        function normalizeKey(s){
            return String(s || '')
                .toLowerCase()
                .replace(/\s+/g, ' ')
                .replace(/[()]/g, '')
                .replace(/[–—-]/g, '-')
                .trim();
        }

        const INVENTORY = getInventoryComponents();
        const INVENTORY_BY_TEXT = new Map(
            INVENTORY.map(it => [normalizeKey(it?.text || it?.label || ''), it]).filter(([k]) => Boolean(k))
        );
        const INVENTORY_KEYS = Array.from(INVENTORY_BY_TEXT.keys());

        function findInventoryByLabel(label){
            const key = normalizeKey(label);
            if (!key) return null;
            const exact = INVENTORY_BY_TEXT.get(key);
            if (exact) return exact;

            // Fuzzy/contains matching for labels like "Main PCB (from Etsy)" vs "PCB"
            let bestKey = '';
            for (const invKey of INVENTORY_KEYS) {
                if (!invKey) continue;
                if (key.includes(invKey) || invKey.includes(key)) {
                    // prefer the most specific (longest) match
                    if (invKey.length > bestKey.length) bestKey = invKey;
                }
            }
            return bestKey ? (INVENTORY_BY_TEXT.get(bestKey) || null) : null;
        }

            2: ['Magnetic Connectorcable'],
            3: ['Heat Inserts (M3x6mm)'],

            6: ['Motor and Driver (ULN2003)', 'Dupont Connector Cables', 'PCB'],
            7: ['Rubber Feet (20x15x8mm)', 'Mounting Screws (M4x12)', 'Matching Nuts (M4) / Inserts'],
            8: ['Bearring (6908ZZ)'],
            9: ['Steel Ball Plungers (4mm x 5)'],
            12: ['LED WS2811 (5V, 720 LEDs/m)', 'Magnetic Connectorcable'],
        };

        function getOverrideComponentsForStep(stepNo){
            const labels = COMPONENTS_OVERRIDE_BY_STEP_NO?.[stepNo];
            if (!Array.isArray(labels) || !labels.length) return [];
            const out = [];
            const seen = new Set();
            labels.forEach(lbl => {
                const inv = findInventoryByLabel(lbl);
                if (!inv) return;
                const key = normalizeKey(inv?.text || inv?.label || lbl);
                if (!key || seen.has(key)) return;
                seen.add(key);
                out.push(inv);
            });
            return out;
        }

        function isComponentListItems(items){
            if (!Array.isArray(items) || !items.length) return false;
            const objItems = items.filter(it => typeof it === 'object' && it);
            if (!objItems.length) return false;

            // If most object items match inventory, treat as component list (to prevent duplicates like 4.3 / 7.3)
            let matchCount = 0;
            for (const it of objItems) {
                const label = it?.text || it?.label || '';
                if (findInventoryByLabel(label)) matchCount += 1;
            }
            return matchCount >= Math.max(2, Math.ceil(objItems.length * 0.6));
        }

        function getComponentsFromStepText(step){
            if (!INVENTORY_KEYS.length) return [];

            const chunks = [];
            if (step?.title) chunks.push(String(step.title));
            const sections = Array.isArray(step?.sections) ? step.sections : [];
            for (const sec of sections) {
                if (sec?.type === 'title' && sec?.text) chunks.push(String(sec.text));
                if (sec?.type === 'text' && sec?.text) chunks.push(String(sec.text));
                // sometimes items contain component names even if we don't want to display the list itself
                if (sec?.type === 'list' && Array.isArray(sec?.items)) {
                    sec.items.forEach(it => {
                        if (typeof it === 'string') chunks.push(it);
                        else if (it && (it.text || it.label)) chunks.push(String(it.text || it.label));
                    });
                }
            }

            const blob = normalizeKey(chunks.join(' | '));
            if (!blob) return [];

            const out = [];
            const seen = new Set();

            // match by inventory keys present in step text
            for (const invKey of INVENTORY_KEYS) {
                if (!invKey) continue;
                if (blob.includes(invKey)) {
                    const inv = INVENTORY_BY_TEXT.get(invKey);
                    if (!inv) continue;
                    if (seen.has(invKey)) continue;
                    seen.add(invKey);
                    out.push(inv);
                }
            }

            // fallback: try fuzzy match against whole title/text chunks
            if (!out.length) {
                for (const chunk of chunks) {
                    const inv = findInventoryByLabel(chunk);
                    if (!inv) continue;
                    const key = normalizeKey(inv?.text || inv?.label || '');
                    if (!key || seen.has(key)) continue;
                    seen.add(key);
                    out.push(inv);
                }
            }

            return out;
        }

        function getStepDomId(step, index){
            if (step?.isHome) return 'step-home';
            const no = getStepNumber(step, index + 1);
            return `step-${no}`;
        }

        config.steps.forEach((step, i) => {
            const stepElement = document.createElement('div');
            stepElement.className = 'step';
            stepElement.id = getStepDomId(step, i);
            
            let html = `<div class="step-scroll"><div class="step-content">`;
            
            if(step.isHome) {
                html += `<div class="block hero-img"><img src="${step.image}"></div>`;
                html += `<div class="block"><div class="title">${step.title}</div><div class="text">${step.text}</div>`;
                if(step.guide) {
                    html += `<div class="nav-guide"><span>📄 If you wish you can download the guide as a PDF</span></div>`;
                }
                html += `</div>`;
            } else if (Array.isArray(step.sections)) {
                const stepNo = getStepNumber(step, i);
                let subNo = 0;

                // Interpret components from step text; render right after the title section.
                // Skip the inventory step itself to avoid duplication.
                const isInventoryStep = /inventory/i.test(step?.title || '') || /inventory/i.test(step?.sections?.find?.(s => s?.type === 'title')?.text || '');
                const overrideComponents = (!isInventoryStep && INVENTORY.length) ? getOverrideComponentsForStep(stepNo) : [];
                const inferredComponents = (!isInventoryStep && INVENTORY.length && !overrideComponents.length) ? getComponentsFromStepText(step) : [];
                const usedComponents = overrideComponents.length ? overrideComponents : inferredComponents;
                let didRenderComponentsAfterTitle = false;
                const hasTitleSection = step.sections.some(sec => sec?.type === 'title' && sec?.text);
                if (!hasTitleSection && step.title) {
                    html += `<div class="block title">${step.title}</div>`;
                    if (usedComponents.length) {
                        subNo += 1;
                        html += renderList(usedComponents, renderBadge(stepNo, subNo), 'Components');
                        didRenderComponentsAfterTitle = true;
                    }
                }

                for (let s = 0; s < step.sections.length; s++) {
                    const section = step.sections[s];
                    const next = step.sections[s + 1];

                    // Combine: title + list (same kachel)
                    if (section?.type === 'title' && section?.text && next?.type === 'list' && next?.items) {
                        // Skip component list blocks in steps; they are shown in "Components" tile after title.
                        if (usedComponents.length && isComponentListItems(next.items)) {
                            html += `<div class="block title">${section.text}</div>`;
                            if (!didRenderComponentsAfterTitle && usedComponents.length) {
                                subNo += 1;
                                html += renderList(usedComponents, renderBadge(stepNo, subNo), 'Components');
                                didRenderComponentsAfterTitle = true;
                            }
                            s += 1; // consume the list
                            continue;
                        }
                        subNo += 1;
                        html += renderList(next.items, renderBadge(stepNo, subNo), section.text);
                        s += 1;
                        continue;
                    }

                    if (section?.type === 'title') {
                        if (section.text) {
                            html += `<div class="block title">${section.text}</div>`;
                        }
                        if (!didRenderComponentsAfterTitle && usedComponents.length) {
                            subNo += 1;
                            html += renderList(usedComponents, renderBadge(stepNo, subNo), 'Components');
                            didRenderComponentsAfterTitle = true;
                        }
                        continue;
                    }

                    const isMedia = section?.type === 'image' || section?.type === 'video';
                    const hasFollowingText = isMedia && next?.type === 'text' && typeof next?.text === 'string' && next.text.trim().length > 0;

                    // Pair media + next text into one "tile" (same kachel)
                    if (hasFollowingText && section.src) {
                        subNo += 1;
                        const badge = renderBadge(stepNo, subNo);

                        if (section.type === 'image') {
                            html += `
                                <div class="block substep tile">
                                    ${badge}
                                    <div class="tile-media hero-img"><img src="${section.src}"></div>
                                    <div class="tile-text"><div class="text">${next.text}</div></div>
                                </div>
                            `;
                        } else {
                            const qrUrl = encodeURIComponent(section.src);
                            html += `
                                <div class="block substep tile video-tile">
                                    ${badge}
                                    <div class="tile-media video">
                                        <video controls><source src="${section.src}"></video>
                                        <div class="qr-print-only">
                                            <div class="text" style="margin-bottom:8px;">Scan for video</div>
                                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${qrUrl}" alt="QR code to video">
                                        </div>
                                    </div>
                                    <div class="tile-text"><div class="text">${next.text}</div></div>
                                </div>
                            `;
                        }

                        s += 1; // skip the consumed text section
                        continue;
                    }

                    // Standalone sections (also get a sub-number)
                    if (section?.type === 'image' && section.src) {
                        subNo += 1;
                        html += `<div class="block hero-img substep">${renderBadge(stepNo, subNo)}<img src="${section.src}"></div>`;
                        continue;
                    }
if (section?.type === 'video' && section.src) {
    subNo += 1;
    const qrUrl = encodeURIComponent(section.src);
    const isYouTube = section.src.includes('youtube.com') || section.src.includes('youtu.be');

    let videoContent;
    if (isYouTube) {
        // YouTube Embed für Shorts (Hochformat 9:16)
        videoContent = `
            <div style="position:relative; padding-bottom:177%; height:0; overflow:hidden; border-radius:20px; background:#000;">
                <iframe src="${section.src}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allowfullscreen></iframe>
            </div>`;
    } else {
        // Normaler Player für deine .mp4 Dateien
        videoContent = `<video controls><source src="${section.src}"></video>`;
    }

    html += `
        <div class="block video substep">
            ${renderBadge(stepNo, subNo)}
            ${videoContent}
            <div class="qr-print-only">
                <div class="text" style="margin-bottom:8px;">Scan for video</div>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${qrUrl}" alt="QR code">
            </div>
        </div>`;
    continue;
}
                    if (section?.type === 'text' && section.text) {
                        subNo += 1;
                        html += `<div class="block text substep">${renderBadge(stepNo, subNo)}${section.text}</div>`;
                        continue;
                    }
                    if (section?.type === 'list' && section.items) {
                        // Remove duplicate component lists (e.g. old 4.3 / 7.3 blocks)
                        if (usedComponents.length && isComponentListItems(section.items)) {
                            continue;
                        }
                        subNo += 1;
                        html += renderList(section.items, renderBadge(stepNo, subNo));
                        continue;
                    }
                    if (section?.type === 'icons' && section.items) {
                        subNo += 1;
                        html += `<div class="block icons substep">${renderBadge(stepNo, subNo)}${section.items.map(icon => `<div class="icon">${icon}</div>`).join('')}</div>`;
                        continue;
                    }
                    if (section?.type === 'costSummary') {
                        subNo += 1;
                        html += renderCostSummary(stepNo, subNo);
                        continue;
                    }
                }
            } else {
                if(step.title) html += `<div class="block title">${step.title}</div>`;
                const images = step.images || (step.image ? [step.image] : []);
                images.forEach(src => {
                    html += `<div class="block hero-img"><img src="${src}"></div>`;
                });
                if (step.video) {
                    const qrUrl = encodeURIComponent(step.video);
                    const isYouTube = /youtube\.com|youtu\.be/.test(step.video);

                    let videoContent;
                    if (isYouTube) {
                        const match = step.video.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/)([^&?]+)/);
                        const videoId = match ? match[1] : '-k997PMsLOE';

                        videoContent = `
                            <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" style="text-decoration:none; color:inherit;">
                                <div style="position:relative; width:100%; border-radius:20px; overflow:hidden;">
                                    <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" style="width:100%; display:block; border-radius:20px;">
                                    
                                    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.1);">
                                        <div style="background:rgba(255,255,255,0.25); width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding-left:5px; border:2px solid rgba(255,255,255,0.5); backdrop-filter: blur(2px);">
                                            <div style="width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; border-left: 22px solid rgba(255,255,255,0.9);"></div>
                                        </div>
                                    </div>
                                </div>
                                <div style="text-align:center; margin-top:12px; font-weight:600; color:#8B6130;">
                                    ▶ Watch video on YouTube
                                </div>
                            </a>`;
                    } else {
                        // Standard für lokale .mp4 Dateien
                        videoContent = `<video controls style="width:100%; border-radius:20px; display:block;"><source src="${step.video}"></video>`;
                    }

                    html += `
                        <div class="block video">
                            ${videoContent}
                            <div class="qr-print-only">
                                <div class="text" style="margin-bottom:8px;">Scan for video</div>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${qrUrl}" alt="QR code">
                            </div>
                        </div>`;
                }
                if(step.text)  html += `<div class="block text">${step.text}</div>`;
                if(step.list)  html += renderList(step.list);
                if(step.icons) {
                    html += `<div class="block icons">${step.icons.map(icon => `<div class="icon">${icon}</div>`).join('')}</div>`;
                }
            }
            
            html += `<div class="bottom-spacer" aria-hidden="true"></div></div></div>`;
            stepElement.innerHTML = html;
            container.appendChild(stepElement);

            const dot = document.createElement('div');
            dot.className = 'dot';
            dotsContainer.appendChild(dot);
        });

        function updateSidePanel(index) {
            // Update active state in chapter list
            document.querySelectorAll('.side-panel-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        function populateChapterList() {
            const chapterList = document.getElementById('chapterList');
            config.steps.forEach((step, index) => {
                const chapterItem = document.createElement('div');
                chapterItem.className = 'side-panel-item';
                chapterItem.textContent = step.title || 'Step ' + (index + 1);
                chapterItem.addEventListener('click', () => {
                    container.scrollTo({ left: index * window.innerWidth, behavior: 'smooth' });
                });
                if (index === 0) chapterItem.classList.add('active');
                chapterList.appendChild(chapterItem);
            });
        }

        function handleScroll() {
            const index = Math.round(container.scrollLeft / window.innerWidth);
            document.querySelectorAll('.dot').forEach((dot, i) => dot.classList.toggle('active', i === index));
            prevBtn.disabled = index <= 0;
            updateSidePanel(index);

            if (index >= config.steps.length - 1) {
                nextBtnLabel.textContent = 'Back to start';
            } else if (index === 0) {
                nextBtnLabel.textContent = 'Start';
            } else {
                nextBtnLabel.textContent = 'Next step';
            }
        }

        container.addEventListener('scroll', handleScroll);
        window.addEventListener('resize', handleScroll);

        function updateViewportVars(){
            // Reliable vh on mobile + accurate scroll area sizing
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);

            const header = document.querySelector('.header');
            const cta = document.querySelector('.cta-bar');
            const footer = document.querySelector('.footer-ui');
            const headerH = header ? Math.ceil(header.getBoundingClientRect().height) : 60;
            const ctaH = cta ? Math.ceil(cta.getBoundingClientRect().height) : 56;
            const footerH = footer ? Math.ceil(footer.getBoundingClientRect().height) : 64;
            document.documentElement.style.setProperty('--header-h', `${headerH}px`);
            document.documentElement.style.setProperty('--cta-h', `${ctaH}px`);
            document.documentElement.style.setProperty('--footer-h', `${footerH}px`);
        }

        nextBtn.addEventListener('click', () => {
            const index = Math.round(container.scrollLeft / window.innerWidth);
            const nextIndex = (index >= config.steps.length - 1) ? 0 : index + 1;
            container.scrollTo({ left: nextIndex * window.innerWidth, behavior: 'smooth' });
        });
        prevBtn.addEventListener('click', () => {
            const index = Math.round(container.scrollLeft / window.innerWidth);
            const prevIndex = Math.max(0, index - 1);
            container.scrollTo({ left: prevIndex * window.innerWidth, behavior: 'smooth' });
        });

        window.addEventListener('resize', updateViewportVars);
        updateViewportVars();
        handleScroll();
        populateChapterList();

        // Lightbox / image preview
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        function openLightbox(src){
            if (!src) return;
            lightboxImg.src = src;
            lightbox.classList.add('open');
        }
        function closeLightbox(){
            lightbox.classList.remove('open');
            lightboxImg.src = '';
        }
        lightbox.addEventListener('click', closeLightbox);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Delegate clicks on any image inside steps
        container.addEventListener('click', (e) => {
            const img = e.target?.closest?.('img');
            if (!img) return;
            // ignore header logo
            if (img.closest('.header')) return;
            const src = img.getAttribute('src');
            if (!src) return;
            openLightbox(src);
        });

        // Help Modal Functionality - wrapped in DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function() {
            const helpButton = document.getElementById('helpButton');
            const helpModal = document.getElementById('helpModal');
            const helpModalClose = document.getElementById('helpModalClose');
            const questionBtn = document.getElementById('questionBtn');
            const bugBtn = document.getElementById('bugBtn');

            console.log('Help elements found:', {
                helpButton: !!helpButton,
                helpModal: !!helpModal,
                helpModalClose: !!helpModalClose,
                questionBtn: !!questionBtn,
                bugBtn: !!bugBtn
            });

            if (helpButton && helpModal && helpModalClose && questionBtn && bugBtn) {
                helpButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Help button clicked');
                    helpModal.classList.add('active');
                });

                helpModalClose.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    helpModal.classList.remove('active');
                });

                helpModal.addEventListener('click', function(e) {
                    if (e.target === helpModal) {
                        helpModal.classList.remove('active');
                    }
                });

                questionBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const subject = encodeURIComponent('Question about Orbio Assembly Guide');
                    const body = encodeURIComponent('Hi,\n\nI have a question about the Orbio assembly guide:\n\n[Your question here]\n\nThank you!');
                    window.location.href = `mailto:sales.piodeer@gmail.com?subject=${subject}&body=${body}`;
                    helpModal.classList.remove('active');
                });

                bugBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const subject = encodeURIComponent('Bug Report - Orbio Assembly Guide');
                    const body = encodeURIComponent('Hi,\n\nI found a bug in the Orbio assembly guide:\n\n[Describe the bug here]\n\nSteps to reproduce:\n1. [Step 1]\n2. [Step 2]\n3. [Step 3]\n\nExpected result: [What should happen]\n\nActual result: [What actually happens]\n\nThank you!');
                    window.location.href = `mailto:sales.piodeer@gmail.com?subject=${subject}&body=${body}`;
                    helpModal.classList.remove('active');
                });
            }
        });

        // Hash navigation for direct step links (e.g. #step-14)
        function scrollToHash(){
            const hash = window.location.hash;
            if (!hash || !hash.startsWith('#step-')) return;
            const el = document.querySelector(hash);
            if (!el) return;
            container.scrollTo({ left: el.offsetLeft, behavior: 'smooth' });
        }
        window.addEventListener('hashchange', scrollToHash);
        document.addEventListener('click', (e) => {
            const a = e.target?.closest?.('a[href^="#step-"]');
            if (!a) return;
            e.preventDefault();
            const href = a.getAttribute('href') || '';
            if (!href.startsWith('#step-')) return;
            const el = document.querySelector(href);
            if (!el) return;
            history.pushState(null, '', href);
            container.scrollTo({ left: el.offsetLeft, behavior: 'smooth' });
        });

        // initial totals after first render
        updateTotals();
        // allow deep-linking after initial render
        scrollToHash();
    </script>
</body>
</html>
